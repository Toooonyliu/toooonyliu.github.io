async function play(){if(busy)return;question=$('#question').value.trim()||question;if(!question){$('#status').textContent=copy[lang].empty;$('#question').focus();return;}busy=true;const task=++phaseToken;skip=reduce();$('#status').textContent='';$('#begin').disabled=true;$('#language').disabled=true;$('#replay')?.setAttribute('disabled','');$('#again')?.setAttribute('disabled','');$('#count').hidden=false;$('#skip').hidden=skip;let pos=0;const counts=[3,3,5];if(window.innerWidth<=720)$('#palm-space').scrollIntoView?.({behavior:reduce()?'instant':'smooth',block:'center'});for(let stage=0;stage<3;stage++){const start=pos;for(let j=0;j<counts[stage];j++){if(task!==phaseToken)return;pos=(start+j)%6;setPose(pos,skip);$('#phase').textContent=`0${stage+1} / ${copy[lang].step[stage]}`;$('#position').textContent=N[pos];$('#count-detail').textContent=`${j+1} / ${counts[stage]}`;if(!skip)await new Promise(r=>setTimeout(r,610));}if(!skip)await new Promise(r=>setTimeout(r,420));}busy=false;$('#begin').disabled=false;$('#language').disabled=false;$('#count').hidden=true;result=true;showResult();if(window.innerWidth<=720)$('#workspace').scrollIntoView?.({behavior:'instant',block:'start'});}

$('#form').onsubmit=e=>{e.preventDefault();play();};$('#skip').onclick=()=>skip=true;$('#language').onclick=()=>{lang=lang==='zh'?'en':'zh';renderCopy();};$('#about').onclick=()=>{$('#notes').showModal?$('#notes').showModal():$('#notes').setAttribute('open','');};$('#close').onclick=()=>{$('#notes').close?$('#notes').close():$('#notes').removeAttribute('open');};$('#labels').onchange=e=>$('#palm').classList.toggle('labels-on',e.target.checked);window.addEventListener('pagehide',()=>{phaseToken++;cancelAnimationFrame(frame);});paint();renderCopy();
</script></body></html>
